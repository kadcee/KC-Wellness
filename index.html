<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KC Wellness">
<meta name="theme-color" content="#1D9E75">
<title>KC's Wellness Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1D9E75;--gl:#E1F5EE;--gd:#0F6E56;--gm:#5DCAA5;
  --b:#2980B9;--bl:#E8F4FD;--bd2:#1A6A9A;
  --bg:#F5F3EE;--card:#FFFFFF;
  --t:#1C1C1C;--t2:#6B6B6B;--t3:#ADADAD;--bd:#EAEAE8;
  --r:14px;--rs:9px;
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);max-width:430px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(var(--st) + 14px) 20px 16px}
.hd{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.ht{font-size:22px;font-weight:600;color:var(--t)}
main{padding:14px 14px calc(76px + var(--sb))}

/* PROGRESS */
.prog-card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-t{font-size:13px;color:var(--t2)}.prog-p{font-size:13px;font-weight:600;color:var(--gd)}
.prog-track{height:5px;background:var(--gl);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--g);border-radius:3px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-track.blue{background:var(--bl)}.prog-fill.blue{background:var(--b)}

/* CHECKLIST */
.list{display:flex;flex-direction:column;gap:5px}
.item{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.item.done{box-shadow:0 1px 3px rgba(29,158,117,.1),0 0 0 1px rgba(29,158,117,.25)}
.irow{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.4,0,.2,1);background:var(--bg)}
.cb.on{background:var(--g);border-color:var(--g)}
.cb svg{width:13px;height:13px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.cb.on svg{opacity:1;transform:scale(1)}
.iname{font-size:15px;color:var(--t)}.itime{font-size:12px;color:var(--t3);margin-top:1px}
.irow.done .iname{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--gm)}
.sub{padding:0 15px 12px 52px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:500;font-family:'Outfit',sans-serif;padding:5px 12px;border-radius:20px;border:1.5px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.pill.on{border-color:var(--g);background:var(--gl);color:var(--gd)}

/* LOG CARDS */
.log-card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.log-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.log-num{font-size:30px;font-weight:600;color:var(--t);line-height:1}.log-num.hit{color:var(--gd)}.log-num.hit-b{color:var(--bd2)}
.log-goal{font-size:13px;color:var(--t2)}.log-ok{font-size:16px;font-weight:600;margin-left:2px}.log-ok.green{color:var(--g)}.log-ok.blue{color:var(--b)}
.log-entries{margin:12px 0 0}
.log-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.log-row:last-child{border-bottom:none}
.log-lbl{flex:1;font-size:14px;color:var(--t)}.log-val{font-size:14px;font-weight:500;color:var(--t);min-width:42px;text-align:right}
.log-del{width:28px;height:28px;border:none;background:none;color:var(--t3);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:0;line-height:1;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.log-del:active{background:var(--bd)}.log-empty{font-size:13px;color:var(--t3);padding:10px 0 4px;text-align:center}
.log-add{display:flex;gap:7px;margin-top:12px;align-items:center}
.log-add-lbl{flex:1;min-width:0;height:38px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:14px;color:var(--t);background:var(--bg);outline:none;padding:0 10px;transition:border-color .2s}
.log-add-lbl:focus{border-color:var(--g)}
.log-add-val{width:58px;height:38px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:var(--t);text-align:center;background:var(--bg);outline:none;-moz-appearance:textfield;transition:border-color .2s;flex-shrink:0}
.log-add-val:focus{border-color:var(--g)}
.log-add-val::-webkit-outer-spin-button,.log-add-val::-webkit-inner-spin-button{-webkit-appearance:none}
.log-add-btn{width:38px;height:38px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-size:24px;font-weight:300;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:1px}
.log-add-btn:active{opacity:.82}.log-add-btn.blue{background:var(--b)}

/* BOTTOM CARDS */
.bc{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.slbl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.erow{display:flex;gap:7px}
.ebtn{flex:1;height:40px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--bg);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ebtn.on{background:var(--g);border-color:var(--g);color:#fff}
.nin{width:100%;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:14px;line-height:1.55;color:var(--t);background:transparent;resize:none}
.nin::placeholder{color:var(--t3)}

/* MEAL GUIDE */
.mg-section{background:var(--card);border-radius:var(--r);margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd);overflow:hidden}
.mg-header{padding:14px 16px 0}.mg-title{font-size:15px;font-weight:600;color:var(--t);margin-bottom:2px}.mg-sub{font-size:12px;color:var(--t3);margin-bottom:12px}
.mg-row{display:flex;align-items:baseline;justify-content:space-between;padding:9px 16px;border-top:1px solid var(--bd)}
.mg-tap{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s}.mg-tap:active{background:var(--gl)}
.mg-name{font-size:13px;color:var(--t);flex:1;padding-right:12px;line-height:1.4}.mg-pro{font-size:12px;font-weight:600;color:var(--gd);white-space:nowrap;flex-shrink:0}
.mg-custom{border-top:1px solid var(--bd);padding:12px 16px}.mg-custom-lbl{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.mg-del{width:28px;height:28px;border:none;background:none;color:var(--t3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:0;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.mg-del:active{background:var(--bd)}
.mg-add{display:flex;gap:7px;margin-top:10px;align-items:center}
.mg-add-lbl{flex:1;min-width:0;height:36px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:13px;color:var(--t);background:var(--bg);outline:none;padding:0 10px;transition:border-color .2s}
.mg-add-lbl:focus{border-color:var(--g)}
.mg-add-val{width:54px;height:36px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;color:var(--t);text-align:center;background:var(--bg);outline:none;-moz-appearance:textfield;flex-shrink:0}
.mg-add-val::-webkit-outer-spin-button,.mg-add-val::-webkit-inner-spin-button{-webkit-appearance:none}
.mg-add-btn{width:36px;height:36px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-size:22px;font-weight:300;cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1;padding-bottom:1px}
.mg-add-btn:active{opacity:.82}

/* SUMMARY */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.sc-l{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.sc-v{font-size:28px;font-weight:600;color:var(--t);line-height:1;margin-bottom:3px}.sc-s{font-size:11px;color:var(--t3)}
.cc{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.bars{display:flex;gap:3px;align-items:flex-end;height:44px;margin:10px 0 6px}
.barcol{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.bar-lbls{display:flex;gap:3px}.bar-lbl{flex:1;font-size:9px;color:var(--t3);text-align:center}
.wc{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wr{display:flex;align-items:center;gap:10px;margin-bottom:9px}.wr:last-child{margin-bottom:0}
.wn{font-size:13px;color:var(--t);min-width:105px}.wtr{flex:1;height:4px;background:var(--gl);border-radius:2px}
.wf{height:100%;background:var(--g);border-radius:2px}.wct{font-size:13px;color:var(--t2);min-width:14px;text-align:right}

/* WEEKLY LOG */
.wl-stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.wl-stat{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wl-stat-l{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.wl-stat-v{font-size:26px;font-weight:600;color:var(--t);line-height:1;margin-bottom:3px}.wl-stat-s{font-size:11px;color:var(--t3)}
.wl-stat-v.lost{color:var(--gd)}

.wl-form{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wl-field{margin-bottom:14px}
.wl-field:last-child{margin-bottom:0}
.wl-label{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.wl-input{width:100%;height:40px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:15px;color:var(--t);background:var(--bg);outline:none;padding:0 12px;transition:border-color .2s}
.wl-input:focus{border-color:var(--g)}
.wl-input[type=number]{-moz-appearance:textfield}
.wl-input[type=number]::-webkit-outer-spin-button,.wl-input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.dose-row{display:flex;gap:6px;flex-wrap:wrap}
.dpill{font-size:12px;font-weight:500;font-family:'Outfit',sans-serif;padding:6px 12px;border-radius:20px;border:1.5px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.dpill.on{border-color:var(--g);background:var(--gl);color:var(--gd)}

.photo-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px dashed var(--bd);border-radius:var(--rs);cursor:pointer;-webkit-tap-highlight-color:transparent;background:var(--bg);width:100%}
.photo-btn svg{width:20px;height:20px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.photo-btn span{font-size:14px;color:var(--t2)}
.photo-preview{width:100%;height:140px;object-fit:cover;border-radius:var(--rs);margin-top:8px;display:none}

.wl-save{width:100%;height:44px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent}
.wl-save:active{opacity:.85}

.wl-entries{display:flex;flex-direction:column;gap:8px}
.wl-card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wl-card-img{width:100%;height:130px;object-fit:cover;display:block}
.wl-card-body{padding:12px 14px}
.wl-card-date{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.wl-card-stats{display:flex;gap:16px;align-items:baseline}
.wl-card-stat{display:flex;flex-direction:column;gap:1px}
.wl-card-val{font-size:18px;font-weight:600;color:var(--t);line-height:1}
.wl-card-val.green{color:var(--gd)}
.wl-card-lbl{font-size:11px;color:var(--t3)}
.wl-card-del{margin-left:auto;width:28px;height:28px;border:none;background:none;color:var(--t3);font-size:18px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.wl-card-del:active{background:var(--bd)}

.wl-setup{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wl-setup-row{display:flex;gap:8px;align-items:flex-end}
.wl-setup-row .wl-input{flex:1}
.wl-setup-btn{height:40px;padding:0 16px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;flex-shrink:0}
.wl-setup-btn:active{opacity:.85}
.wl-divider{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px}

/* TABS */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);display:flex;padding:6px 2px calc(6px + var(--sb));z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border:none;background:none;cursor:pointer;border-radius:var(--rs);-webkit-tap-highlight-color:transparent}
.tab:active{background:var(--gl)}
.tic{width:20px;height:20px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.tab.on .tic{stroke:var(--g)}
.tlbl{font-family:'Outfit',sans-serif;font-size:9px;font-weight:500;color:var(--t3);transition:color .15s}
.tab.on .tlbl{color:var(--g)}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fadein .18s ease}
</style>
</head>
<body>

<header>
  <div class="hd" id="hdate"></div>
  <div class="ht">KC's Wellness Tracker</div>
</header>
<main id="main"></main>

<nav class="tabs">
  <button class="tab on" id="t-today" onclick="go('today')">
    <svg class="tic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <span class="tlbl">Today</span>
  </button>
  <button class="tab" id="t-yesterday" onclick="go('yesterday')">
    <svg class="tic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
    <span class="tlbl">Yest</span>
  </button>
  <button class="tab" id="t-week" onclick="go('week')">
    <svg class="tic" viewBox="0 0 24 24"><path d="M4 20V10M8 20V4M12 20v-6M16 20V8M20 20v-4"/></svg>
    <span class="tlbl">Week</span>
  </button>
  <button class="tab" id="t-month" onclick="go('month')">
    <svg class="tic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h8M8 18h5"/></svg>
    <span class="tlbl">Month</span>
  </button>
  <button class="tab" id="t-meals" onclick="go('meals')">
    <svg class="tic" viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
    <span class="tlbl">Meals</span>
  </button>
  <button class="tab" id="t-log" onclick="go('log')">
    <svg class="tic" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5c0 5-5 13-5 13S7 12 7 7a5 5 0 0 1 5-5z"/><circle cx="12" cy="7" r="2"/></svg>
    <span class="tlbl">Log</span>
  </button>
</nav>

<script>
const ITEMS=[
  {id:'electrolyte',name:'Electrolyte stick',time:'6:50 AM'},
  {id:'clothes',name:'Workout clothes on at 9:45 AM',time:'9:45 AM'},
  {id:'workout',name:'Workout done',time:'9:45 AM',sub:'workout'},
  {id:'meal1',name:'Meal 1 (shake + yogurt)',time:'10:30 AM'},
  {id:'supplements',name:'Supplements',time:'10:30 AM'},
  {id:'creatine',name:'Creatine 5g',time:'10-11 AM'},
  {id:'snack',name:'Snack',time:'1-2 PM'},
  {id:'meal2',name:'Meal 2 / Dinner',time:'5-6 PM'},
  {id:'protein',name:'Protein 125g+',time:'All day'},
  {id:'water',name:'Water 80 oz',time:'All day'},
  {id:'magnesium',name:'Magnesium',time:'Before bed'},
];
const WT=['Day A - Lower','Day B - Upper','Day C - Full Body','Walk','Rest'];
const DOSES=['2.5mg','5mg','7.5mg','10mg','12.5mg','15mg'];
const MEAL1_DEFAULT=[
  {name:'Elevation shake + 1 cup Fage 5% yogurt',pro:'48-53g'},
  {name:'3 eggs + 4oz smoked salmon + half avocado',pro:'38g'},
  {name:'1 cup Fage 5% yogurt + 1 scoop protein + berries',pro:'40g'},
  {name:'2 eggs + 4oz ground turkey scramble + salsa + tortilla',pro:'36g'},
  {name:'3-egg omelet + 2oz shredded chicken + cheese + pico',pro:'40g'},
  {name:'1 cup cottage cheese + everything bagel seasoning + tomatoes',pro:'28g+'},
];
const SNACK_DEFAULT=[
  {name:'Elevation protein shake (Aldi)',pro:'30g'},
  {name:'Half cup cottage cheese + fruit',pro:'14g'},
  {name:'2 hard boiled eggs + 1 string cheese',pro:'20g'},
  {name:'2oz beef or turkey jerky',pro:'20g'},
  {name:'Fage 2% single serve yogurt (5.3oz)',pro:'17g'},
];
const MEAL2_DEFAULT=[
  {name:'6oz grilled chicken thigh + broccoli + half cup rice',pro:'44g'},
  {name:'6oz salmon + asparagus + olive oil + lemon',pro:'40g'},
  {name:'6oz lean ground beef taco bowl',pro:'45g'},
  {name:'5oz grilled chicken Caesar salad',pro:'40g'},
  {name:'6oz shrimp stir fry + snap peas + half cup rice',pro:'38g'},
  {name:'5oz pork tenderloin + sweet potato + green beans',pro:'38g'},
];

let tab='today';
let pendingDose='';
let pendingPhoto='';

// ---- STORAGE ----
function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dy}`}
function doff(n){const d=new Date();d.setDate(d.getDate()-n);return fd(d)}
function dates(n){return Array.from({length:n},(_,i)=>doff(n-1-i))}
function empty(){return{items:{},workoutType:'',proteinLog:[],waterLog:[],energy:0,notes:''}}
function load(date){
  try{
    const r=localStorage.getItem('wt_'+date);if(!r)return empty();
    const d=JSON.parse(r);
    if(!d.proteinLog){d.proteinLog=[];if(d.proteinAmount&&parseInt(d.proteinAmount)>0)d.proteinLog=[{label:'Logged',grams:parseInt(d.proteinAmount)}];}
    if(!d.waterLog)d.waterLog=[];return d;
  }catch{return empty()}
}
function save(date,log){try{localStorage.setItem('wt_'+date,JSON.stringify(log))}catch{}}
function loadMeals(){try{const r=localStorage.getItem('wt_meals');return r?JSON.parse(r):{meal1:[],snack:[],meal2:[]}}catch{return{meal1:[],snack:[],meal2:[]}}}
function saveMeals(m){try{localStorage.setItem('wt_meals',JSON.stringify(m))}catch{}}
function loadWeekly(){try{const r=localStorage.getItem('wt_weekly');return r?JSON.parse(r):{startWeight:null,startDate:null,entries:[]}}catch{return{startWeight:null,startDate:null,entries:[]}}}
function saveWeekly(w){try{localStorage.setItem('wt_weekly',JSON.stringify(w))}catch{}}
function ptTotal(log){return(log.proteinLog||[]).reduce((a,b)=>a+(b.grams||0),0)}
function wtTotal(log){return(log.waterLog||[]).reduce((a,b)=>a+(b.oz||0),0)}

// ---- ROUTING ----
function go(t){
  tab=t;pendingDose='';pendingPhoto='';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-'+t).classList.add('on');
  render(true);
}
function render(anim){
  const m=document.getElementById('main');
  if(anim){m.classList.remove('ani');void m.offsetWidth;m.classList.add('ani')}
  if(tab==='today')m.innerHTML=dayHTML(doff(0));
  else if(tab==='yesterday')m.innerHTML=dayHTML(doff(1));
  else if(tab==='week')m.innerHTML=sumHTML(dates(7),'Last 7 days');
  else if(tab==='month')m.innerHTML=sumHTML(dates(30),'Last 30 days');
  else if(tab==='meals')m.innerHTML=mealsHTML();
  else m.innerHTML=weeklyHTML();
}

// ---- DAY VIEW ----
function dayHTML(date){
  const log=load(date);
  const done=ITEMS.filter(i=>log.items[i.id]).length;
  const p=Math.round(done/ITEMS.length*100);
  const rows=ITEMS.map(item=>{
    const ch=!!log.items[item.id];
    let extra='';
    if(ch&&item.sub==='workout')extra=`<div class="sub">${WT.map(t=>`<button class="pill${log.workoutType===t?' on':''}" onclick="setWT(event,'${date}','${t}')">${t}</button>`).join('')}</div>`;
    return `<div class="item${ch?' done':''}"><div class="irow${ch?' done':''}" onclick="toggle('${date}','${item.id}')"><div class="cb${ch?' on':''}"><svg viewBox="0 0 13 13"><polyline points="1.5,6.5 5,10 11.5,3"/></svg></div><div><div class="iname">${item.name}</div><div class="itime">${item.time}</div></div></div>${extra}</div>`;
  }).join('');
  const ebtns=[1,2,3,4,5].map(n=>`<button class="ebtn${log.energy===n?' on':''}" onclick="setE('${date}',${n})">${n}</button>`).join('');
  return `
    <div class="prog-card"><div class="prog-row"><span class="prog-t">${done} of ${ITEMS.length} done</span><span class="prog-p">${p}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${p}%"></div></div></div>
    <div class="list">${rows}</div>
    ${logCardHTML('protein',date,log)}
    ${logCardHTML('water',date,log)}
    <div class="bc"><div class="slbl">Energy today (1 = drained, 5 = strong)</div><div class="erow">${ebtns}</div></div>
    <div class="bc"><div class="slbl">Notes</div><textarea class="nin" rows="2" placeholder="Optional..." oninput="setN('${date}',this.value)">${log.notes||''}</textarea></div>`;
}

function logCardHTML(type,date,log){
  const isW=type==='water';
  const entries=isW?(log.waterLog||[]):(log.proteinLog||[]);
  const total=isW?wtTotal(log):ptTotal(log);
  const goal=isW?80:125;const unit=isW?'oz':'g';
  const hit=total>=goal;const pct=Math.min(Math.round(total/goal*100),100);
  const title=isW?'Water log':'Protein log';const ph=isW?'e.g. Coffee, Bottle':'e.g. Shake, Chicken';
  const valPh=isW?'oz':'g';const inputId=isW?`wlbl-${date}`:`ptlbl-${date}`;
  const valId=isW?`woz-${date}`:`ptg-${date}`;
  const addFn=isW?`addW('${date}')`:`addPR('${date}')`;
  const delFn=i=>isW?`delW('${date}',${i})`:`delPR('${date}',${i})`;
  const hitClass=hit?(isW?' hit-b':' hit'):'';const okClass=isW?'blue':'green';
  const trackClass=isW?' blue':'';const btnClass=isW?' blue':'';
  const rows=entries.length
    ?entries.map((e,i)=>`<div class="log-row"><span class="log-lbl">${e.label||'Logged'}</span><span class="log-val">${isW?e.oz:e.grams}${unit}</span><button class="log-del" onclick="${delFn(i)}">&#215;</button></div>`).join('')
    :`<div class="log-empty">No entries yet</div>`;
  return `<div class="log-card"><div class="slbl">${title}</div><div class="log-head"><span class="log-num${hitClass}">${total}${unit}</span><span class="log-goal">of ${goal}${unit} goal</span>${hit?`<span class="log-ok ${okClass}">&#10003;</span>`:''}</div><div class="prog-track${trackClass}"><div class="prog-fill${trackClass}" style="width:${pct}%"></div></div><div class="log-entries">${rows}</div><div class="log-add"><input class="log-add-lbl" id="${inputId}" type="text" placeholder="${ph}" maxlength="30"><input class="log-add-val" id="${valId}" type="number" placeholder="${valPh}" min="0" max="999" onkeydown="if(event.key==='Enter')${addFn}"><button class="log-add-btn${btnClass}" onclick="${addFn}">+</button></div></div>`;
}

// ---- MEALS ----
function parseGrams(pro){return parseInt(String(pro))||0}
function addMealToLog(name,pro){
  const grams=parseGrams(pro);if(!grams)return;
  const date=doff(0);const log=load(date);
  if(!log.proteinLog)log.proteinLog=[];
  log.proteinLog.push({label:name,grams});
  log.items.protein=ptTotal(log)>=125;
  save(date,log);showToast('+'+grams+'g added to today');
}
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);background:#1C1C1C;color:#fff;font-family:Outfit,sans-serif;font-size:13px;font-weight:500;padding:9px 18px;border-radius:20px;z-index:200;pointer-events:none;transition:opacity .25s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._hide);t._hide=setTimeout(()=>t.style.opacity='0',1800);
}
function mealsHTML(){
  const cm=loadMeals();
  function section(key,defaults,title,sub,inputPrefix){
    const custom=cm[key]||[];
    const defRows=defaults.map(o=>{const n=o.name.replace(/'/g,"\\'");return `<div class="mg-row mg-tap" onclick="addMealToLog('${n}','${o.pro}')"><span class="mg-name">${o.name}</span><span class="mg-pro">${o.pro}</span></div>`;}).join('');
    const custRows=custom.map((o,i)=>{const n=o.name.replace(/'/g,"\\'");return `<div class="mg-row mg-tap" onclick="addMealToLog('${n}',${o.pro})"><span class="mg-name">${o.name}</span><span class="mg-pro">${o.pro}g</span><button class="mg-del" onclick="event.stopPropagation();delMeal('${key}',${i})">&#215;</button></div>`;}).join('');
    return `<div class="mg-section"><div class="mg-header"><div class="mg-title">${title}</div><div class="mg-sub">${sub} &nbsp;·&nbsp; Tap to add to today</div></div>${defRows}${custom.length?custRows:''}<div class="mg-custom"><div class="mg-custom-lbl">Add your own</div><div class="mg-add"><input class="mg-add-lbl" id="mn-${inputPrefix}" type="text" placeholder="Meal description" maxlength="60"><input class="mg-add-val" id="mg-${inputPrefix}" type="number" placeholder="g" min="0" max="999" onkeydown="if(event.key==='Enter')addMeal('${key}','${inputPrefix}')"><button class="mg-add-btn" onclick="addMeal('${key}','${inputPrefix}')">+</button></div></div></div>`;
  }
  return `${section('meal1',MEAL1_DEFAULT,'Meal 1','10:30 AM  |  35-40g protein','m1')}${section('snack',SNACK_DEFAULT,'Snack','1-2 PM  |  20-30g protein','sn')}${section('meal2',MEAL2_DEFAULT,'Meal 2 / Dinner','5-6 PM  |  40-45g protein','m2')}`;
}
function addMeal(key,prefix){
  const nameIn=document.getElementById('mn-'+prefix);const gIn=document.getElementById('mg-'+prefix);
  const name=nameIn.value.trim();const g=parseInt(gIn.value||0);
  if(!name||!g||g<=0){if(!name)nameIn.focus();else gIn.focus();return}
  const cm=loadMeals();if(!cm[key])cm[key]=[];cm[key].push({name,pro:g});
  saveMeals(cm);nameIn.value='';gIn.value='';render(false);
}
function delMeal(key,idx){const cm=loadMeals();if(!cm[key])return;cm[key].splice(idx,1);saveMeals(cm);render(false);}

// ---- WEEKLY LOG ----
function weeklyHTML(){
  const w=loadWeekly();
  const entries=[...(w.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const sw=w.startWeight;
  const latest=entries.length?entries[0].weight:null;
  const totalLost=sw&&latest?(sw-latest).toFixed(1):null;

  const statsHTML=sw?`
    <div class="wl-stat-row">
      <div class="wl-stat"><div class="wl-stat-l">Start weight</div><div class="wl-stat-v">${sw}</div><div class="wl-stat-s">lbs</div></div>
      <div class="wl-stat"><div class="wl-stat-l">Total lost</div><div class="wl-stat-v lost">${totalLost!==null?(parseFloat(totalLost)>0?'-'+totalLost:'0'):'--'}</div><div class="wl-stat-s">lbs</div></div>
      ${latest?`<div class="wl-stat"><div class="wl-stat-l">Current</div><div class="wl-stat-v">${latest}</div><div class="wl-stat-s">lbs</div></div>`:''}
      <div class="wl-stat"><div class="wl-stat-l">Entries</div><div class="wl-stat-v">${entries.length}</div><div class="wl-stat-s">weeks logged</div></div>
    </div>`:'';

  const setupHTML=`<div class="wl-setup">
    <div class="slbl">Starting weight</div>
    <div class="wl-setup-row">
      <input class="wl-input" id="sw-input" type="number" placeholder="e.g. 155" value="${sw||''}" step="0.1">
      <button class="wl-setup-btn" onclick="setStartWeight()">Save</button>
    </div>
  </div>`;

  const dosePills=DOSES.map(d=>`<button class="dpill${pendingDose===d?' on':''}" onclick="pickDose('${d}')">${d}</button>`).join('');

  const formHTML=`<div class="wl-form">
    <div class="slbl">Add weekly entry</div>
    <div class="wl-field"><div class="wl-label">Date</div><input class="wl-input" id="wl-date" type="date" value="${doff(0)}"></div>
    <div class="wl-field"><div class="wl-label">Dosage</div><div class="dose-row">${dosePills}</div></div>
    <div class="wl-field"><div class="wl-label">Weight (lbs)</div><input class="wl-input" id="wl-weight" type="number" placeholder="e.g. 148.5" step="0.1"></div>
    <div class="wl-field">
      <div class="wl-label">Photo (optional)</div>
      <label class="photo-btn" for="wl-photo">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span id="photo-lbl">${pendingPhoto?'Photo selected':'Take or upload photo'}</span>
      </label>
      <input type="file" id="wl-photo" accept="image/*" style="display:none" onchange="handlePhoto(this)">
      ${pendingPhoto?`<img id="photo-preview" class="photo-preview" src="${pendingPhoto}" style="display:block">`:''}
    </div>
    <button class="wl-save" onclick="saveEntry()">Save Entry</button>
  </div>`;

  const historyHTML=entries.length?`
    <div class="wl-divider">History</div>
    <div class="wl-entries">
      ${entries.map((e,i)=>{
        const lost=sw?(sw-e.weight).toFixed(1):null;
        const lostStr=lost?(parseFloat(lost)>0?'-'+lost+' lbs':'0 lbs'):'';
        const dateStr=new Date(e.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
        return `<div class="wl-card">
          ${e.photo?`<img class="wl-card-img" src="${e.photo}" alt="Weekly photo">`:''}
          <div class="wl-card-body">
            <div class="wl-card-date">${dateStr}</div>
            <div class="wl-card-stats">
              <div class="wl-card-stat"><div class="wl-card-val">${e.dosage||'--'}</div><div class="wl-card-lbl">Dosage</div></div>
              <div class="wl-card-stat"><div class="wl-card-val">${e.weight} lbs</div><div class="wl-card-lbl">Weight</div></div>
              ${lost?`<div class="wl-card-stat"><div class="wl-card-val green">${lostStr}</div><div class="wl-card-lbl">From start</div></div>`:''}
              <button class="wl-card-del" onclick="delEntry(${i})">&#215;</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`:'';

  return `${statsHTML}${setupHTML}${formHTML}${historyHTML}`;
}

function setStartWeight(){
  const v=parseFloat(document.getElementById('sw-input').value);
  if(!v||v<=0)return;
  const w=loadWeekly();w.startWeight=v;saveWeekly(w);showToast('Starting weight saved');render(false);
}

function pickDose(d){pendingDose=pendingDose===d?'':d;document.querySelectorAll('.dpill').forEach(b=>b.classList.toggle('on',b.textContent===pendingDose));}

function handlePhoto(input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=500;let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      pendingPhoto=canvas.toDataURL('image/jpeg',0.65);
      const lbl=document.getElementById('photo-lbl');if(lbl)lbl.textContent='Photo ready';
      const prev=document.getElementById('photo-preview');
      if(prev){prev.src=pendingPhoto;prev.style.display='block';}
      else{const img2=document.createElement('img');img2.id='photo-preview';img2.className='photo-preview';img2.src=pendingPhoto;img2.style.display='block';input.parentElement.appendChild(img2);}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveEntry(){
  const dateIn=document.getElementById('wl-date');
  const weightIn=document.getElementById('wl-weight');
  const date=dateIn?dateIn.value:'';
  const weight=parseFloat(weightIn?weightIn.value:'');
  if(!date){showToast('Pick a date');return;}
  if(!weight||weight<=0){showToast('Enter your weight');return;}
  const w=loadWeekly();
  if(!w.entries)w.entries=[];
  const existing=w.entries.findIndex(e=>e.date===date);
  const entry={date,dosage:pendingDose||'',weight,photo:pendingPhoto||''};
  if(existing>=0)w.entries[existing]=entry;else w.entries.push(entry);
  saveWeekly(w);pendingDose='';pendingPhoto='';
  showToast('Entry saved');render(false);
}

function delEntry(sortedIdx){
  const w=loadWeekly();
  const entries=[...(w.entries||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const target=entries[sortedIdx];
  if(!target)return;
  w.entries=w.entries.filter(e=>e.date!==target.date);
  saveWeekly(w);render(false);
}

// ---- DAILY INTERACTIONS ----
function addPR(date){
  const lblIn=document.getElementById('ptlbl-'+date);const gIn=document.getElementById('ptg-'+date);
  const grams=parseInt(gIn.value||0);if(!grams||grams<=0){gIn.focus();return}
  const log=load(date);if(!log.proteinLog)log.proteinLog=[];
  log.proteinLog.push({label:lblIn.value.trim()||'Meal',grams});
  log.items.protein=ptTotal(log)>=125;save(date,log);lblIn.value='';gIn.value='';
  render(false);setTimeout(()=>{const g=document.getElementById('ptg-'+date);if(g)g.focus()},50);
}
function delPR(date,idx){const log=load(date);if(!log.proteinLog)return;log.proteinLog.splice(idx,1);log.items.protein=ptTotal(log)>=125;save(date,log);render(false);}
function addW(date){
  const lblIn=document.getElementById('wlbl-'+date);const ozIn=document.getElementById('woz-'+date);
  const oz=parseInt(ozIn.value||0);if(!oz||oz<=0){ozIn.focus();return}
  const log=load(date);if(!log.waterLog)log.waterLog=[];
  log.waterLog.push({label:lblIn.value.trim()||'Water',oz});
  log.items.water=wtTotal(log)>=80;save(date,log);lblIn.value='';ozIn.value='';
  render(false);setTimeout(()=>{const g=document.getElementById('woz-'+date);if(g)g.focus()},50);
}
function delW(date,idx){const log=load(date);if(!log.waterLog)return;log.waterLog.splice(idx,1);log.items.water=wtTotal(log)>=80;save(date,log);render(false);}
function toggle(date,id){
  const log=load(date);log.items[id]=!log.items[id];
  if(!log.items[id]&&id==='workout')log.workoutType='';
  save(date,log);render(false);
}
function setWT(e,date,type){
  e.stopPropagation();const log=load(date);log.workoutType=log.workoutType===type?'':type;save(date,log);
  e.target.closest('.sub').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.textContent===log.workoutType));
}
function setE(date,n){
  const log=load(date);log.energy=log.energy===n?0:n;save(date,log);
  document.querySelectorAll('.ebtn').forEach((b,i)=>b.classList.toggle('on',i+1===log.energy));
}
function setN(date,val){const log=load(date);log.notes=val;save(date,log);}

// ---- SUMMARY ----
function sumHTML(ds,label){
  const logs=ds.map(d=>load(d));
  const wo=logs.filter(l=>l.items.workout).length;
  const pr=logs.filter(l=>ptTotal(l)>=125||l.items.protein).length;
  const su=logs.filter(l=>l.items.creatine||l.items.supplements).length;
  const ev=logs.map(l=>l.energy).filter(e=>e>0);
  const ae=ev.length?(ev.reduce((a,b)=>a+b,0)/ev.length).toFixed(1):'--';
  const cards=[{l:'Workouts',v:wo,s:`of ${ds.length} days`},{l:'Protein 125g+',v:pr,s:'days hit'},{l:'Supps days',v:su,s:'creatine or stack'},{l:'Avg energy',v:ae,s:'out of 5'}].map(c=>`<div class="sc"><div class="sc-l">${c.l}</div><div class="sc-v">${c.v}</div><div class="sc-s">${c.s}</div></div>`).join('');
  const bars=ds.map((d,i)=>{const log=logs[i];const done=ITEMS.filter(it=>log.items[it.id]).length;const p=Math.round(done/ITEMS.length*100);const h=p>0?Math.max(Math.round(p/100*44),4):3;const col=p>=80?'#1D9E75':p>=50?'#5DCAA5':p>0?'#9FE1CB':'#EAEAE8';return `<div class="barcol" style="height:${h}px;background:${col}"></div>`;}).join('');
  const lbls=ds.map(d=>`<div class="bar-lbl">${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'narrow'})}</div>`).join('');
  const types={};logs.forEach(l=>{if(l.workoutType&&l.workoutType!=='Rest')types[l.workoutType]=(types[l.workoutType]||0)+1});
  const twrows=Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,c])=>{const w=wo>0?Math.round(c/wo*100):0;return `<div class="wr"><span class="wn">${t}</span><div class="wtr"><div class="wf" style="width:${w}%"></div></div><span class="wct">${c}</span></div>`;}).join('');
  return `<div style="margin-bottom:10px"><div class="slbl">${label}</div></div><div class="sgrid">${cards}</div><div class="cc"><div class="slbl">Daily completion</div><div class="bars">${bars}</div><div class="bar-lbls">${lbls}</div></div>${twrows?`<div class="wc"><div class="slbl" style="margin-bottom:12px">Workout breakdown</div>${twrows}</div>`:''}`;
}

document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
render(true);
</script>
</body>
</html>
