<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wellness">
<meta name="theme-color" content="#1D9E75">
<title>Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --g:#1D9E75;
  --gl:#E1F5EE;
  --gd:#0F6E56;
  --gm:#5DCAA5;
  --bg:#F5F3EE;
  --card:#FFFFFF;
  --t:#1C1C1C;
  --t2:#6B6B6B;
  --t3:#ADADAD;
  --bd:#EAEAE8;
  --r:14px;
  --rs:9px;
  --st:env(safe-area-inset-top,20px);
  --sb:env(safe-area-inset-bottom,0px);
}

html,body{height:100%;overflow-x:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);max-width:430px;margin:0 auto;-webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(var(--st) + 14px) 20px 16px}
.hd{font-size:11px;font-weight:500;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.ht{font-size:22px;font-weight:600;color:var(--t)}

main{padding:14px 14px calc(76px + var(--sb))}

.prog-card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.prog-t{font-size:13px;color:var(--t2)}
.prog-p{font-size:13px;font-weight:600;color:var(--gd)}
.prog-track{height:5px;background:var(--gl);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--g);border-radius:3px;transition:width .35s cubic-bezier(.4,0,.2,1)}

.list{display:flex;flex-direction:column;gap:5px}
.item{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd);transition:box-shadow .15s}
.item.done{box-shadow:0 1px 3px rgba(29,158,117,.1),0 0 0 1px rgba(29,158,117,.25)}
.irow{display:flex;align-items:center;gap:13px;padding:13px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}

.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.4,0,.2,1);background:var(--bg)}
.cb.on{background:var(--g);border-color:var(--g)}
.cb svg{width:13px;height:13px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.cb.on svg{opacity:1;transform:scale(1)}

.iname{font-size:15px;color:var(--t);transition:color .2s}
.itime{font-size:12px;color:var(--t3);margin-top:1px}
.irow.done .iname{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--gm)}

.sub{padding:0 15px 12px 52px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:500;font-family:'Outfit',sans-serif;padding:5px 12px;border-radius:20px;border:1.5px solid var(--bd);background:var(--bg);color:var(--t2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.pill.on{border-color:var(--g);background:var(--gl);color:var(--gd)}

/* PROTEIN TRACKER */
.pt-card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.pt-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.pt-num{font-size:30px;font-weight:600;color:var(--t);line-height:1;transition:color .3s}
.pt-num.hit{color:var(--gd)}
.pt-goal{font-size:13px;color:var(--t2)}
.pt-ok{font-size:16px;color:var(--g);font-weight:600;margin-left:2px}

.pt-entries{margin:12px 0 0}
.pt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pt-row:last-child{border-bottom:none}
.pt-lbl-txt{flex:1;font-size:14px;color:var(--t)}
.pt-g-txt{font-size:14px;font-weight:500;color:var(--t);min-width:38px;text-align:right}
.pt-del{width:28px;height:28px;border:none;background:none;color:var(--t3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:0;line-height:1;-webkit-tap-highlight-color:transparent}
.pt-del:active{background:var(--bd)}

.pt-add{display:flex;gap:7px;margin-top:12px;align-items:center}
.pt-lbl-in{flex:1;height:38px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:14px;color:var(--t);background:var(--bg);outline:none;padding:0 10px;transition:border-color .2s}
.pt-lbl-in:focus{border-color:var(--g)}
.pt-g-in{width:62px;height:38px;border:1.5px solid var(--bd);border-radius:var(--rs);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:var(--t);text-align:center;background:var(--bg);outline:none;-moz-appearance:textfield;transition:border-color .2s}
.pt-g-in:focus{border-color:var(--g)}
.pt-g-in::-webkit-outer-spin-button,.pt-g-in::-webkit-inner-spin-button{-webkit-appearance:none}
.pt-btn{height:38px;padding:0 16px;border-radius:var(--rs);border:none;background:var(--g);color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0}
.pt-btn:active{opacity:.85}
.pt-empty{font-size:13px;color:var(--t3);padding:10px 0 4px;text-align:center}

.bc{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.slbl{font-size:11px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}

.erow{display:flex;gap:7px}
.ebtn{flex:1;height:40px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--bg);font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;color:var(--t2);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ebtn.on{background:var(--g);border-color:var(--g);color:#fff}

.nin{width:100%;border:none;outline:none;font-family:'Outfit',sans-serif;font-size:14px;line-height:1.55;color:var(--t);background:transparent;resize:none}
.nin::placeholder{color:var(--t3)}

/* SUMMARY */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sc{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.sc-l{font-size:10px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.sc-v{font-size:28px;font-weight:600;color:var(--t);line-height:1;margin-bottom:3px}
.sc-s{font-size:11px;color:var(--t3)}

.cc{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.bars{display:flex;gap:3px;align-items:flex-end;height:44px;margin:10px 0 6px}
.barcol{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.bar-lbls{display:flex;gap:3px}
.bar-lbl{flex:1;font-size:9px;color:var(--t3);text-align:center}

.wc{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05),0 0 0 1px var(--bd)}
.wr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.wr:last-child{margin-bottom:0}
.wn{font-size:13px;color:var(--t);min-width:105px}
.wtr{flex:1;height:4px;background:var(--gl);border-radius:2px}
.wf{height:100%;background:var(--g);border-radius:2px}
.wct{font-size:13px;color:var(--t2);min-width:14px;text-align:right}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--bd);display:flex;padding:8px 4px calc(8px + var(--sb));z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:none;background:none;cursor:pointer;border-radius:var(--rs);-webkit-tap-highlight-color:transparent;transition:background .1s}
.tab:active{background:var(--gl)}
.tic{width:22px;height:22px;stroke:var(--t3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.tab.on .tic{stroke:var(--g)}
.tlbl{font-family:'Outfit',sans-serif;font-size:10px;font-weight:500;color:var(--t3);transition:color .15s}
.tab.on .tlbl{color:var(--g)}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fadein .18s ease}
</style>
</head>
<body>

<header>
  <div class="hd" id="hdate"></div>
  <div class="ht">Wellness Tracker</div>
</header>

<main id="main"></main>

<nav class="tabs">
  <button class="tab on" id="t-today" onclick="go('today')">
    <svg class="tic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <span class="tlbl">Today</span>
  </button>
  <button class="tab" id="t-yesterday" onclick="go('yesterday')">
    <svg class="tic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
    <span class="tlbl">Yesterday</span>
  </button>
  <button class="tab" id="t-week" onclick="go('week')">
    <svg class="tic" viewBox="0 0 24 24"><path d="M4 20V10M8 20V4M12 20v-6M16 20V8M20 20v-4"/></svg>
    <span class="tlbl">Week</span>
  </button>
  <button class="tab" id="t-month" onclick="go('month')">
    <svg class="tic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h8M8 18h5"/></svg>
    <span class="tlbl">Month</span>
  </button>
</nav>

<script>
const ITEMS=[
  {id:'electrolyte',name:'Electrolyte stick',time:'6:50 AM'},
  {id:'clothes',name:'Clothes on at 9:45 AM',time:'9:45 AM'},
  {id:'workout',name:'Workout done',time:'9:45 AM',sub:'workout'},
  {id:'meal1',name:'Meal 1 (shake + yogurt)',time:'10:30 AM'},
  {id:'supplements',name:'Supplements',time:'10:30 AM'},
  {id:'creatine',name:'Creatine 5g',time:'10-11 AM'},
  {id:'snack',name:'Snack',time:'1-2 PM'},
  {id:'meal2',name:'Meal 2 / Dinner',time:'5-6 PM'},
  {id:'protein',name:'Protein 125g+',time:'All day'},
  {id:'water',name:'Water 80 oz',time:'All day'},
  {id:'magnesium',name:'Magnesium',time:'Before bed'},
];

const WT=['Day A - Lower','Day B - Upper','Day C - Full Body','Walk','Rest'];
let tab='today';

function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dy}`}
function doff(n){const d=new Date();d.setDate(d.getDate()-n);return fd(d)}
function dates(n){return Array.from({length:n},(_,i)=>doff(n-1-i))}

function empty(){return{items:{},workoutType:'',proteinLog:[],energy:0,notes:''}}

function load(date){
  try{
    const r=localStorage.getItem('wt_'+date);
    if(!r) return empty();
    const d=JSON.parse(r);
    if(!d.proteinLog){
      d.proteinLog=[];
      if(d.proteinAmount&&parseInt(d.proteinAmount)>0){
        d.proteinLog=[{label:'Logged',grams:parseInt(d.proteinAmount)}];
      }
    }
    return d;
  }catch{return empty()}
}

function save(date,log){try{localStorage.setItem('wt_'+date,JSON.stringify(log))}catch{}}

function ptTotal(log){return(log.proteinLog||[]).reduce((a,b)=>a+(b.grams||0),0)}

function go(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('t-'+t).classList.add('on');
  render(true);
}

function render(anim){
  const m=document.getElementById('main');
  if(anim){m.classList.remove('ani');void m.offsetWidth;m.classList.add('ani')}
  if(tab==='today') m.innerHTML=dayHTML(doff(0));
  else if(tab==='yesterday') m.innerHTML=dayHTML(doff(1));
  else if(tab==='week') m.innerHTML=sumHTML(dates(7),'Last 7 days');
  else m.innerHTML=sumHTML(dates(30),'Last 30 days');
}

function dayHTML(date){
  const log=load(date);
  const done=ITEMS.filter(i=>log.items[i.id]).length;
  const p=Math.round(done/ITEMS.length*100);

  const rows=ITEMS.map(item=>{
    const ch=!!log.items[item.id];
    let extra='';
    if(ch&&item.sub==='workout'){
      extra=`<div class="sub">${WT.map(t=>`<button class="pill${log.workoutType===t?' on':''}" onclick="setWT(event,'${date}','${t}')">${t}</button>`).join('')}</div>`;
    }
    return `<div class="item${ch?' done':''}" id="i-${item.id}">
      <div class="irow${ch?' done':''}" onclick="toggle('${date}','${item.id}')">
        <div class="cb${ch?' on':''}"><svg viewBox="0 0 13 13"><polyline points="1.5,6.5 5,10 11.5,3"/></svg></div>
        <div><div class="iname">${item.name}</div><div class="itime">${item.time}</div></div>
      </div>${extra}</div>`;
  }).join('');

  const ebtns=[1,2,3,4,5].map(n=>`<button class="ebtn${log.energy===n?' on':''}" onclick="setE('${date}',${n})">${n}</button>`).join('');

  return `
    <div class="prog-card">
      <div class="prog-row"><span class="prog-t">${done} of ${ITEMS.length} done</span><span class="prog-p">${p}%</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${p}%"></div></div>
    </div>
    <div class="list">${rows}</div>
    ${ptCardHTML(date,log)}
    <div class="bc"><div class="slbl">Energy today (1 = drained, 5 = strong)</div><div class="erow">${ebtns}</div></div>
    <div class="bc"><div class="slbl">Notes</div><textarea class="nin" rows="2" placeholder="Optional..." oninput="setN('${date}',this.value)">${log.notes||''}</textarea></div>`;
}

function ptCardHTML(date,log){
  const entries=log.proteinLog||[];
  const total=ptTotal(log);
  const hit=total>=125;
  const pct=Math.min(Math.round(total/125*100),100);

  const rows=entries.length
    ? entries.map((e,i)=>`
        <div class="pt-row">
          <span class="pt-lbl-txt">${e.label||'Meal'}</span>
          <span class="pt-g-txt">${e.grams}g</span>
          <button class="pt-del" onclick="delPR('${date}',${i})" aria-label="Remove">&#215;</button>
        </div>`).join('')
    : `<div class="pt-empty">No entries yet</div>`;

  return `
    <div class="pt-card">
      <div class="slbl">Protein log</div>
      <div class="pt-head">
        <span class="pt-num${hit?' hit':''}">${total}g</span>
        <span class="pt-goal">of 125g goal</span>
        ${hit?'<span class="pt-ok">&#10003;</span>':''}
      </div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="pt-entries">${rows}</div>
      <div class="pt-add">
        <input class="pt-lbl-in" id="ptlbl-${date}" type="text" placeholder="Meal name (optional)" maxlength="30">
        <input class="pt-g-in" id="ptg-${date}" type="number" placeholder="g" min="0" max="999" onkeydown="if(event.key==='Enter')addPR('${date}')">
        <button class="pt-btn" onclick="addPR('${date}')">Add</button>
      </div>
    </div>`;
}

function addPR(date){
  const lblIn=document.getElementById('ptlbl-'+date);
  const gIn=document.getElementById('ptg-'+date);
  const grams=parseInt(gIn.value||0);
  if(!grams||grams<=0){gIn.focus();return}
  const log=load(date);
  if(!log.proteinLog) log.proteinLog=[];
  log.proteinLog.push({label:lblIn.value.trim()||'Meal',grams});
  const total=ptTotal(log);
  log.items.protein=total>=125;
  save(date,log);
  lblIn.value='';
  gIn.value='';
  render(false);
  setTimeout(()=>{const g=document.getElementById('ptg-'+date);if(g)g.focus()},50);
}

function delPR(date,idx){
  const log=load(date);
  if(!log.proteinLog) return;
  log.proteinLog.splice(idx,1);
  const total=ptTotal(log);
  log.items.protein=total>=125;
  save(date,log);
  render(false);
}

function toggle(date,id){
  const log=load(date);
  log.items[id]=!log.items[id];
  if(!log.items[id]&&id==='workout') log.workoutType='';
  save(date,log);render(false);
}

function setWT(e,date,type){
  e.stopPropagation();
  const log=load(date);
  log.workoutType=log.workoutType===type?'':type;
  save(date,log);
  e.target.closest('.sub').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.textContent===log.workoutType));
}

function setE(date,n){
  const log=load(date);
  log.energy=log.energy===n?0:n;
  save(date,log);
  document.querySelectorAll('.ebtn').forEach((b,i)=>b.classList.toggle('on',i+1===log.energy));
}

function setN(date,val){
  const log=load(date);log.notes=val;save(date,log);
}

function sumHTML(ds,label){
  const logs=ds.map(d=>load(d));
  const wo=logs.filter(l=>l.items.workout).length;
  const pr=logs.filter(l=>ptTotal(l)>=125||l.items.protein).length;
  const su=logs.filter(l=>l.items.creatine||l.items.supplements).length;
  const ev=logs.map(l=>l.energy).filter(e=>e>0);
  const ae=ev.length?(ev.reduce((a,b)=>a+b,0)/ev.length).toFixed(1):'--';

  const cards=[
    {l:'Workouts',v:wo,s:`of ${ds.length} days`},
    {l:'Protein 125g+',v:pr,s:'days hit'},
    {l:'Supps days',v:su,s:'creatine or stack'},
    {l:'Avg energy',v:ae,s:'out of 5'},
  ].map(c=>`<div class="sc"><div class="sc-l">${c.l}</div><div class="sc-v">${c.v}</div><div class="sc-s">${c.s}</div></div>`).join('');

  const bars=ds.map((d,i)=>{
    const log=logs[i];
    const done=ITEMS.filter(it=>log.items[it.id]).length;
    const p=Math.round(done/ITEMS.length*100);
    const h=p>0?Math.max(Math.round(p/100*44),4):3;
    const col=p>=80?'#1D9E75':p>=50?'#5DCAA5':p>0?'#9FE1CB':'#EAEAE8';
    return `<div class="barcol" style="height:${h}px;background:${col}"></div>`;
  }).join('');

  const lbls=ds.map(d=>`<div class="bar-lbl">${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'narrow'})}</div>`).join('');

  const types={};
  logs.forEach(l=>{if(l.workoutType&&l.workoutType!=='Rest')types[l.workoutType]=(types[l.workoutType]||0)+1});
  const twrows=Object.entries(types).sort((a,b)=>b[1]-a[1]).map(([t,c])=>{
    const w=wo>0?Math.round(c/wo*100):0;
    return `<div class="wr"><span class="wn">${t}</span><div class="wtr"><div class="wf" style="width:${w}%"></div></div><span class="wct">${c}</span></div>`;
  }).join('');

  return `<div style="margin-bottom:10px"><div class="slbl">${label}</div></div>
  <div class="sgrid">${cards}</div>
  <div class="cc"><div class="slbl">Daily completion</div><div class="bars">${bars}</div><div class="bar-lbls">${lbls}</div></div>
  ${twrows?`<div class="wc"><div class="slbl" style="margin-bottom:12px">Workout breakdown</div>${twrows}</div>`:''}`;
}

document.getElementById('hdate').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
render(true);
</script>
</body>
</html>
